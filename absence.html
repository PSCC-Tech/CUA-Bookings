<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUA Bookings</title>
    <!--<link rel="stylesheet" href="styles.css">-->
    <link rel="stylesheet" href="CSS/base.css?v=20260518-1">
    <link rel="stylesheet" href="CSS/index.css?v=20260514-5">
    <link rel="stylesheet" href="CSS/theme.css?v=20260518-4">
</head>
<body>

    <div class="container">

        <!-- LEFT NAVIGATION -->
        <nav class="sidebar">
            <h2 class="logo">CUA Bookings</h2>

            <ul class="nav-links">
                <li class="active">Bookings</li>
                <li onclick="window.location='courses.html'">Courses</li>
                <li onclick="window.location='mentors.html'">Mentors</li>
                <li onclick="window.location='account.html'">Account</li>
            </ul>

            <div class="logout">
                <span>Logout</span>
            </div>
        </nav>

        <!-- MAIN CONTENT -->
        <main class="content">

            <!-- TOP OPTIONS -->
            <div class="top-menu">
                <span class="top-option" onclick="window.location='index.html'">Create</span>
                <span class="top-option active">Absence</span>
                <span class="top-option" onclick="window.location='view.html?v=20260514-5'">Upcoming</span>
                <span class="top-option" onclick="window.location='data.html'">Data</span>
            </div>

            <!-- FORM SECTION -->
            <div class="form-container">
                <h2>Mentor Absence</h2>

                <form>
                    <label>Mentor</label>
                    <select id="mentor-select">
                        <option value="">Select a Mentor</option>
                    </select>

                    <label>Date</label>
                    <input type="date" id="absence-date">

            <label>Unavailable For</label>
            <div class="radio-group">
                <label>
                    <input type="radio" name="unavailable-type" value="full-day" checked>
                    Whole Day
                </label>

                <label>
                    <input type="radio" name="unavailable-type" value="specific-time">
                    Specific Time
                </label>
            </div>

            <div id="time-selectors">
                <label>From</label>
                <select id="start-time">
                    <option value="">Select a time</option>
                </select>

                <label>To</label>
                <select id="end-time">
                    <option value="">Select a time</option>
                </select>
            </div>

                    <label>Reason for Absence</label>
                    <textarea rows="3"></textarea>

                    <label>Made by</label>
                    <input type="text">

                    <button type="submit">Submit</button>
                </form>
            </div>
                <!-- FOOTER -->
            <footer class="footer">
                
            </footer>
        </main>

    </div>

<script src="Scripts/BackendAPI.js?v=20260514-5"></script>
<script src="Scripts/Auth.js?v=20260518-1"></script>
<script src="Scripts/Logout.js?v=20260518-1"></script>

<script type="module">
    import ScheduleGenerator from "/Scripts/ScheduleGenerator.js";

    function populateTimeDropdowns(times) {
        const startSelect = document.getElementById("start-time");
        const endSelect = document.getElementById("end-time");

        startSelect.innerHTML = `<option value="">Select a time</option>`;
        endSelect.innerHTML = `<option value="">Select a time</option>`;

        times.forEach(t => {
            startSelect.innerHTML += `<option value="${t}">${t}</option>`;
            endSelect.innerHTML += `<option value="${t}">${t}</option>`;
        });
    }

    const times = ScheduleGenerator.generateTimeOptions("08:00", "16:00");
    populateTimeDropdowns(times);
</script>

<script>
    async function loadMentorsForAbsence() {
        const mentorSelect = document.getElementById("mentor-select");
        if (!mentorSelect || !window.CUAApi) return;

        try {
            const mentors = await window.CUAApi.getMentors({}, true);
            mentorSelect.innerHTML = `<option value="">Select a Mentor</option>`;
            mentors.forEach(mentor => {
                const option = document.createElement("option");
                option.value = mentor.mentor_number;
                option.textContent = mentor.name;
                option.dataset.mentorName = mentor.name;
                mentorSelect.appendChild(option);
            });
        } catch (error) {
            console.warn("Could not load mentors for absence form:", error);
        }
    }

        // Hide/show time selectors based on radio choice
        const radios = document.querySelectorAll("input[name='unavailable-type']");
        const timeSelectors = document.getElementById("time-selectors");

        // Whole day is default → keep time selectors hidden
        timeSelectors.style.display = "none";

        radios.forEach(radio => {
            radio.addEventListener("change", () => {
                if (radio.value === "specific-time") {
                    timeSelectors.style.display = "block";
                } else {
                    timeSelectors.style.display = "none";
                }
            });
        });

        document.querySelector(".form-container form").addEventListener("submit", async (event) => {
            event.preventDefault();

            const selectedOption = document.getElementById("mentor-select").selectedOptions[0];
            const payload = {
                mentor_number: selectedOption?.value || "",
                mentor_name: selectedOption?.dataset.mentorName || "",
                date: document.getElementById("absence-date").value,
                unavailable_type: document.querySelector("input[name='unavailable-type']:checked")?.value || "full-day",
                start_time: document.getElementById("start-time").value,
                end_time: document.getElementById("end-time").value,
                reason: document.querySelector("textarea").value.trim(),
                made_by: document.querySelector(".form-container input[type='text']").value.trim()
            };

            if (!payload.mentor_number || !payload.date) {
                alert("Please select a mentor and date.");
                return;
            }

            try {
                await window.CUAApi.createAbsence(payload);
                await window.MentorScheduleStore?.loadFromApi?.(true);
                alert("Absence saved successfully.");
                event.target.reset();
                timeSelectors.style.display = "none";
            } catch (error) {
                alert(error.message || "Could not save the absence.");
            }
        });

        loadMentorsForAbsence();
</script>
</body>
</html>
