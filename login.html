<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - CUA Bookings</title>
    <link rel="stylesheet" href="CSS/base.css?v=20260521-6">
    <link rel="stylesheet" href="CSS/login.css?v=20260521-1">
    <link rel="stylesheet" href="CSS/theme.css?v=20260521-6">
</head>
<body class="login-page">
    <main class="login-shell">
        <div class="login-brand">
            <span class="login-welcome">Welcome back</span>
            <h1>CUA Bookings</h1>
            <p>Sign in to manage mentorship bookings, mentors, courses, and absences.</p>
        </div>

        <p id="login-message" class="login-message" hidden></p>

        <form id="login-form" class="login-form">
            <label>
                Email
                <input type="email" name="email" autocomplete="username" required autofocus>
            </label>

            <label>
                Password
                <span class="password-field">
                    <input id="password" type="password" name="password" autocomplete="current-password" required>
                    <button type="button" id="toggle-password-visibility" class="password-toggle" aria-label="Show password">Show</button>
                </span>
            </label>

            <button type="submit">Sign in</button>
        </form>
    </main>

    <script src="Scripts/AppFeedback.js?v=20260521-1"></script>
<script src="Scripts/InputFormatters.js?v=20260528-3"></script>
    <script src="Scripts/Login.js?v=20260820-1"></script>
</body>
</html>
